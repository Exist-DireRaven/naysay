name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: naysay-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            exe: naysay.exe
            content_type: application/zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: naysay-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            exe: naysay
            content_type: application/gzip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: naysay-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            exe: naysay
            content_type: application/gzip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native-tls prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build
        run: cargo build --release
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/${{ matrix.exe }} dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.exe }} README.md LICENSE dist/
          tar -czf ${{ matrix.archive }} -C dist .
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
