[package]
name = "naysay"
version = "0.3.0"
edition = "2021"
description = "The voice that says no before your coding agents say yes — seed, drill, check, premortem, spec in your terminal"
license = "MIT"
repository = "https://github.com/Exist-DireRaven/naysay"
build = "build.rs"

[[bin]]
name = "naysay"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
toml = "0.8"

# keyring 3 ships no keystore by default: without an explicit platform
# feature it falls back to its in-memory mock, so `key set` succeeds and the
# next process finds nothing. Pick the real store per platform (D-040).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
